name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint — flake8 (errors + undefined names) and bandit (medium/high severity)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install flake8 bandit

      - name: flake8
        run: |
          flake8 \
            --max-line-length=120 \
            --select=E,F \
            --exclude=.git,__pycache__,data \
            .

      - name: bandit
        run: |
          bandit -r . \
            --exclude ./.git,./data \
            --severity-level medium \
            -q

  # ---------------------------------------------------------------------------
  # Tests — PyQt6 UI code isn't imported by core/db.py, so pure db tests don't
  # need Qt system libs, but the test job installs them anyway for the day
  # UI-level tests are added (offscreen platform).
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install system libraries for PyQt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v
